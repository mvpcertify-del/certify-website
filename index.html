<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ==== Google Analytics (GA4) ===========================================
         Client, 20 Oct: property G-TXJ62L5PZ4. Placed as early in <head> as
         possible per Google's own install instructions, so pageview timing
         isn't skewed by everything else below it. This is the ONLY analytics
         script on the site — no other tracker is installed anywhere.
    ==================================================================== -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TXJ62L5PZ4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TXJ62L5PZ4');
    </script>

    <!-- ==== Favicon ==========================================================
         The tab icon is the client's official mark (teal outlined "C" enclosing
         a checkmark) — the same artwork used in the app lockup, the invoice and
         receipt PDFs, and the transactional emails. One asset, everywhere.

         There is deliberately no rel="icon" type="image/svg+xml" link here.
         Browsers prefer an SVG icon over a PNG whenever both are declared,
         regardless of source order, so leaving the old /favicon.svg link in
         place would silently keep showing the retired green-shield mark and
         defeat this change entirely. That shield was never the client's logo;
         it is retired, not merely deprioritised, and public/favicon.svg has
         been removed so it cannot be linked again by accident.
         (Deliberately phrased without literal tag markup — a stray "<link ...>"
         inside a comment is exactly the kind of thing a future minifier or
         scraper mis-parses.)

         The PNG is 352x339 with transparency, which browsers downscale for the
         16/32px tab slot. If the client ever supplies vector artwork, replace
         public/brand-mark.png (and regenerate api/_brandAsset.js) rather than
         reintroducing a second, competing icon link here.
    ==================================================================== -->
    <link rel="icon" type="image/png" href="/brand-mark.png" />
    <link rel="apple-touch-icon" href="/brand-mark.png" />

    <!-- Browser UI chrome (Android address bar, iOS PWA, Safari tab strip).
         Matches --color-bg-primary in src/index.css for each theme. -->
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- ==== Fonts, and why they are loaded from here =======================
         Inter used to be pulled in by `@import url(...)` at the top of
         src/index.css. That is the slowest possible way to load a font:
         the browser has to download and parse the whole stylesheet before it
         can even SEE the font URL, then make two more round trips to Google
         (one for the CSS, one for the .woff2) — all of it blocking the first
         paint. On a slow or filtered connection that alone was seconds of
         blank white page, and it is the main reason the site "took a long
         time to open".

         Now: preconnect opens the TLS handshake to both Google origins while
         the app's own JavaScript is still downloading, and media="print"
         means the stylesheet does NOT block rendering — the onload handler
         promotes it to "all" the moment it arrives. Text paints immediately
         in the system-font fallback declared by --font-family and swaps to
         Inter when it lands (the URL already carries &display=swap).
    ==================================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>

    <title>Certify.cx™ - ISO Certification Platform</title>
    <meta name="description" content="Certify.cx™ — ISO Certification Marketplace. Apply for ISO certifications, manage audits, and streamline your compliance workflow." />
    <meta name="google" content="notranslate" />

    <!-- ==== Link previews (WhatsApp, LinkedIn, Slack, iMessage, X) ==========
         og:image and og:url MUST be absolute — scrapers fetch the page from
         their own servers and never resolve a relative path, so "/brand-mark.png"
         renders as no image at all. The production origin is hard-coded on
         purpose: this file is static and has no access to APP_PUBLIC_URL at
         build time, and a preview card pointing at a preview/localhost origin
         is worse than one pointing at production. Update both if the domain
         ever changes.

         twitter:card is "summary" (small square thumbnail), not
         "summary_large_image": the mark is a 352x339 near-square logo, and a
         large-image card would letterbox it into a mostly-empty banner. Switch
         to summary_large_image only once the client supplies a proper ~1200x630
         social banner.
    ==================================================================== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Certify.cx™" />
    <meta property="og:title" content="Certify.cx™ - ISO Certification Platform" />
    <meta property="og:description" content="Certify.cx™ — ISO Certification Marketplace. Apply for ISO certifications, manage audits, and streamline your compliance workflow." />
    <meta property="og:image" content="https://certify.cx/brand-mark.png" />
    <meta property="og:image:alt" content="Certify.cx™" />
    <meta property="og:url" content="https://certify.cx/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Certify.cx™ - ISO Certification Platform" />
    <meta name="twitter:description" content="Certify.cx™ — ISO Certification Marketplace. Apply for ISO certifications, manage audits, and streamline your compliance workflow." />
    <meta name="twitter:image" content="https://certify.cx/brand-mark.png" />

    <!-- ==== First-paint splash ============================================
         Everything above is a few kilobytes of HTML that arrives in the first
         network round trip; React does not appear until its JavaScript has
         downloaded, parsed and mounted. Until now that gap was a plain white
         rectangle, so a perfectly healthy two-second load was indistinguishable
         from a broken site — which is what "Certify.cx is taking long time to
         open" describes.

         This paints the brand mark and a spinner immediately. It is inline on
         purpose: a splash that needed its own stylesheet would arrive at the
         same time as the app and be pointless. main.jsx removes it on mount.

         The background is picked from the same data-theme attribute main.jsx
         sets before React starts, so there is no flash of the wrong theme.
    ==================================================================== -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #171717;
        z-index: 2147483647;
      }
      :root[data-theme='light'] #app-splash { background: #ffffff; }
      #app-splash img { width: 56px; height: 54px; opacity: 0.95; }
      #app-splash span {
        display: block;
        width: 22px;
        height: 22px;
        border: 2px solid rgba(62, 207, 142, 0.25);
        border-top-color: #3ecf8e;
        border-radius: 50%;
        animation: app-splash-spin 0.7s linear infinite;
      }
      @keyframes app-splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash span { animation-duration: 2s; }
      }
    </style>
  </head>
  <body translate="no" class="notranslate">
    <div id="root"></div>
    <div id="app-splash" role="status" aria-label="Loading Certify.cx">
      <img src="/brand-mark.png" alt="" />
      <span></span>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
